[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codebrain-cli"
version = "27.0"
description = "CodeBrain client — connect your codebase to the CodeBrain understanding layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # HTTP client for API + MCP server
    "httpx>=0.27.0",
    # MCP protocol (Claude Code integration)
    "mcp[cli]>=1.0.0",
    # File watcher (codebrain up --watch)
    "watchdog>=4.0.0",
]

[project.scripts]
codebrain = "codebrain.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codebrain*"]
